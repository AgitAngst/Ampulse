[package]
name = "ampulse-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Encrypted mailbox relay for Ampulse (optional, self-hosted)"

[lib]
name = "ampulse_server"
path = "src/lib.rs"

[[bin]]
name = "ampulse-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "=0.23.1"
getrandom = "=0.4.3"
rcgen = "=0.14.10"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
chacha20poly1305 = "=0.11.0"
hkdf = "=0.13.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
