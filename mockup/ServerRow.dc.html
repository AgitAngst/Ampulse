<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки — строка «Сервер»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
input::placeholder{color:#8A9593}
</style>
</helmet>

<div lang="{{lang}}" style="width: 390px; height: 580px; box-sizing: border-box; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.ink}}; font-family: Onest, system-ui, sans-serif; overflow: hidden">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; line-height: 1.15; font-weight: 600">{{l.title}}</h1>
<section style="background: {{t.card}}; border-radius: 20px; padding: 4px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px">
<span style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: {{t.fill}}; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">{{l.updates}}</span>
<span style="font-size: 13px; color: {{t.ink3}}">{{l.updatesHint}}</span>
</span>
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: {{t.ink3}}"><path d="m9 18 6-6-6-6"></path></svg>
</div>
</section>
<sc-for list="{{states}}" as="r" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.ink3}}">{{r.label}}</h2>
<a href="{{href}}" style="background: {{t.card}}; border-radius: 20px; padding: 4px 16px; min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; color: {{t.ink}}; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: {{t.accSoft}}; color: {{t.accText}}; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><path d="M6 6h.01"></path><path d="M6 18h.01"></path></svg>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">{{l.server}}</span>
<span style="font-size: 13px; line-height: 1.35; color: {{t.ink3}}">{{r.hint}}</span>
</span>
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: {{t.ink3}}"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</section>
</sc-for>
<div style="font-size: 13px; line-height: 1.4; color: {{t.ink3}}; padding: 0 4px">{{l.note}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["ru","en"],"default":"ru"},"$preview":{"width":390,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const lang = this.props.lang === 'en' ? 'en' : 'ru';
    const T = {
      light: { bg: '#F4F2EC', card: '#FFFFFF', ink: '#16211F', ink2: '#4A5654', ink3: '#5E6967', acc: '#0B6B63', accText: '#0B5A53', accSoft: '#DDEEEA', onAcc: '#FFFFFF', warn: '#8F4207', warnLine: '#B4540A', warnSoft: '#FBEBDD', fill: '#EFEBE3', line: '#D6D1C6', sep: '#ECE8DF', dim: 'rgba(22, 33, 31, 0.45)' },
      dark: { bg: '#111715', card: '#1A2220', ink: '#ECEAE4', ink2: '#B7C0BD', ink3: '#97A29F', acc: '#4FBFB0', accText: '#7ED8CB', accSoft: '#173530', onAcc: '#1A2220', warn: '#F3A76E', warnLine: '#D98641', warnSoft: '#3A2717', fill: '#252F2C', line: '#3A4542', sep: '#262F2C', dim: 'rgba(0, 0, 0, 0.6)' }
    }[theme];

    const L = {
      ru: {
        title: 'Настройки', updates: 'Обновления', updatesHint: 'Проверка включена', server: 'Сервер',
        states: [
          { label: 'Выключено', hint: 'Выключено. Необязательная копия на вашем сервере' },
          { label: 'Включено', hint: 'Включено · ampulse.example.org' },
          { label: 'Вышли — сервер перестал узнавать устройство', hint: 'Вы вышли. Войдите снова' }
        ],
        note: 'Строка есть только в сборке с сайта (github). В сборках RuStore и Google Play её нет — там сети нет совсем.'
      },
      en: {
        title: 'Settings', updates: 'Updates', updatesHint: 'Checking is on', server: 'Server',
        states: [
          { label: 'Off', hint: 'Off. An optional copy on your own server' },
          { label: 'On', hint: 'On · ampulse.example.org' },
          { label: 'Signed out — the server no longer knows the device', hint: 'Signed out. Sign in again' }
        ],
        note: 'The row exists only in the build from the website (github). The RuStore and Google Play builds have no network at all, so no such row.'
      }
    }[lang];
    const sfx = (theme === 'dark' ? 'Dark' : '') + (lang === 'en' ? 'En' : '');
    return { t: T, l: L, lang: lang, states: L.states, href: 'Server' + sfx + '.dc.html' };
  }
}
</script>
</body>
</html>
