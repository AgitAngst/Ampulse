<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сегодня — тёмная тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111715;color:#ECEAE4;font-family:Onest,system-ui,sans-serif}
a{color:#4FBFB0}a:hover{color:#7ED8CB}
button,input{font-family:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #111715; color: #ECEAE4; font-family: Onest, system-ui, sans-serif; overflow: hidden">
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; color: #97A29F">Суббота, 26 сентября</div>
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.4px">Сегодня</h1>
</div>
<a href="AddMedDark.dc.html" aria-label="Добавить лекарство" style="width: 44px; height: 44px; border-radius: 22px; background: #ECEAE4; color: #1A2220; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</a>
</header>
<div style="background: #1A2220; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 60px; height: 60px; flex-shrink: 0">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="transform: rotate(-90deg)">
<circle cx="30" cy="30" r="25" style="fill: none; stroke: #262F2C; stroke-width: 6"></circle>
<circle cx="30" cy="30" r="25" style="fill: none; stroke: #4FBFB0; stroke-width: 6; stroke-linecap: round; stroke-dasharray: {{ringDash}}"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Literata, Georgia, serif; font-size: 18px; font-weight: 600">{{takenCount}}/{{total}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{summaryTitle}}</div>
<div style="font-size: 14px; line-height: 1.35; color: #B7C0BD">{{nextLine}}</div>
</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #97A29F">{{g.name}}</h2>
<span style="font-size: 13px; color: #97A29F">{{g.meta}}</span>
</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="background: #1A2220; border-radius: 16px; box-sizing: border-box; border: 1.5px solid {{it.border}}; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{it.tileBg}}; color: {{it.tileFg}}">
<sc-if value="{{it.isShot}}" hint-placeholder-val="{{false}}">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 2 4 4"></path><path d="m17 7 3-3"></path><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"></path><path d="m9 11 4 4"></path><path d="m5 19-3 3"></path><path d="m14 4 6 6"></path></svg>
</sc-if>
<sc-if value="{{it.isPill}}" hint-placeholder-val="{{true}}">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg>
</sc-if>
</div>
<sc-if value="{{it.isShot}}" hint-placeholder-val="{{false}}">
<a href="InjectionDark.dc.html" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; color: #ECEAE4; text-decoration: none">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{it.subColor}}">{{it.sub}} ›</span>
</a>
</sc-if>
<sc-if value="{{it.isPill}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{it.subColor}}">{{it.sub}}</span>
</div>
</sc-if>
<sc-if value="{{it.isDone}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{it.toggle}}" aria-label="Снять отметку: {{it.name}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; padding: 0; background: #4FBFB0; color: #1A2220; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M20 6 9 17l-5-5"></path></svg>
</button>
</sc-if>
<sc-if value="{{it.isLater}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{it.toggle}}" aria-label="Отметить приём: {{it.name}}" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 22px; border: 2px solid #3A4542; padding: 0; background: #1A2220; cursor: pointer"></button>
</sc-if>
<sc-if value="{{it.isSoon}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{it.toggle}}" style="height: 44px; flex-shrink: 0; padding: 0 16px; border-radius: 22px; border: none; background: #4FBFB0; color: #1A2220; font-size: 15px; font-weight: 600; cursor: pointer">Принять</button>
</sc-if>
<sc-if value="{{it.isLate}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{it.toggle}}" style="height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 0 15px; border-radius: 22px; border: 1.5px solid #D98641; background: #3A2717; color: #F3A76E; font-size: 15px; font-weight: 600; cursor: pointer">Принять</button>
</sc-if>
</div>
</sc-for>
</section>
</sc-for>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #97A29F">Замеры</h2>
<span style="font-size: 13px; color: #97A29F">1 из 2</span>
</div>
<a href="BPEntryDark.dc.html" style="background: #1A2220; border-radius: 16px; box-sizing: border-box; min-height: 68px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; color: #ECEAE4; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: #173530; color: #4FBFB0; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600">Давление</span>
<span style="font-size: 13px; color: #7ED8CB">Утром 128/82 · вечером в 20:00</span>
</span>
<span style="flex-shrink: 0; height: 48px; padding: 0 16px; border-radius: 24px; background: #252F2C; display: flex; align-items: center; font-size: 15px; font-weight: 600">Измерить</span>
</a>
</section>
</main>
<nav aria-label="Разделы" style="flex-shrink: 0; height: 76px; box-sizing: border-box; padding: 8px 8px 14px; background: #1A2220; border-top: 1px solid #2A3431; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="MainDark.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #4FBFB0; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
<span>Сегодня</span>
</a>
<a href="HistoryDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #B7C0BD; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
<span>История</span>
</a>
<a href="StockDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #B7C0BD; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v4"></path><path d="M14 13h-4"></path><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path><path d="M18 6v14"></path><path d="M6 6v14"></path><rect x="2" y="6" width="20" height="14" rx="2"></rect></svg>
<span>Аптечка</span>
</a>
<a href="AccessDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #B7C0BD; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span>Близкие</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const NOW = 13 * 60 + 52;
    const NOW_LABEL = '13:52';
    const taken = (this.state && this.state.taken) || { levo: '07:04', metf1: '08:41' };
    const meds = [
      { id: 'levo', g: 0, time: '07:00', name: 'Левотироксин 50 мкг', note: '1 таблетка, натощак', shot: false },
      { id: 'metf1', g: 0, time: '08:30', name: 'Метформин 850 мг', note: '1 таблетка, с едой', shot: false },
      { id: 'd3', g: 1, time: '13:00', name: 'Витамин D3 2000 МЕ', note: '1 капсула, с едой', shot: false },
      { id: 'metf2', g: 1, time: '14:00', name: 'Метформин 850 мг', note: '1 таблетка, с едой', shot: false },
      { id: 'ator', g: 2, time: '21:00', name: 'Аторвастатин 20 мг', note: '1 таблетка', shot: false },
      { id: 'ins', g: 2, time: '22:00', name: 'Инсулин гларгин', note: '12 ЕД, живот справа', shot: true }
    ];
    const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3));
    const ago = (m) => (m >= 60 ? Math.floor(m / 60) + ' ч ' : '') + (m % 60) + ' мин';
    const items = meds.map((m) => {
      const at = taken[m.id];
      const diff = toMin(m.time) - NOW;
      const status = at ? 'done' : diff < 0 ? 'late' : diff <= 60 ? 'soon' : 'later';
      let sub = m.time + ' · ' + m.note;
      let subColor = '#97A29F';
      if (status === 'done') { sub = (m.shot ? 'Сделано в ' : 'Принято в ') + at; subColor = '#7ED8CB'; }
      if (status === 'late') { sub = m.time + ' · прошло ' + ago(-diff); subColor = '#F3A76E'; }
      if (status === 'soon') { sub = m.time + ' · через ' + diff + ' мин'; subColor = '#ECEAE4'; }
      return {
        g: m.g, time: m.time, name: m.name,
        isShot: m.shot, isPill: !m.shot,
        isDone: status === 'done', isLate: status === 'late', isSoon: status === 'soon', isLater: status === 'later',
        sub: sub, subColor: subColor,
        border: status === 'late' ? '#6E4727' : '#1A2220',
        tileBg: status === 'done' ? '#173530' : '#252F2C',
        tileFg: status === 'done' ? '#4FBFB0' : '#B7C0BD',
        toggle: () => {
          const next = Object.assign({}, taken);
          if (next[m.id]) delete next[m.id]; else next[m.id] = NOW_LABEL;
          this.setState({ taken: next });
        }
      };
    });
    const groups = ['Утро', 'День', 'Вечер'].map((name, gi) => {
      const list = items.filter((it) => it.g === gi);
      const done = list.filter((it) => it.isDone).length;
      return { name: name, items: list, meta: done + ' из ' + list.length };
    });
    const total = items.length;
    const takenCount = items.filter((it) => it.isDone).length;
    const C = 2 * Math.PI * 25;
    const late = items.find((it) => it.isLate);
    const next = items.find((it) => it.isSoon || it.isLater);
    let nextLine = 'На сегодня всё отмечено';
    if (late) nextLine = 'Не отмечен: ' + late.name + ', ' + late.time;
    else if (next) nextLine = 'Дальше: ' + next.name + ', ' + next.time;
    return {
      groups: groups,
      total: total,
      takenCount: takenCount,
      ringDash: (C * takenCount / total).toFixed(1) + ' ' + C.toFixed(1),
      summaryTitle: takenCount === total ? 'Все приёмы отмечены' : 'Принято ' + takenCount + ' из ' + total,
      nextLine: nextLine
    };
  }
}
</script>
</body>
</html>
