<section aria-label="Выбор места укола" style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">

<span style="position: absolute; right: 0; top: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #5E6967">Левая</span>
<svg width="200" height="320" viewBox="0 0 200 320" aria-hidden="true" style="position: absolute; left: 59px; top: 0">
<rect x="58" y="200" width="40" height="118" rx="18" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<rect x="102" y="200" width="40" height="118" rx="18" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<rect x="22" y="80" width="24" height="150" rx="12" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<rect x="154" y="80" width="24" height="150" rx="12" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<rect x="90" y="50" width="20" height="24" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<rect x="52" y="68" width="96" height="150" rx="30" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></rect>
<circle cx="100" cy="34" r="24" style="fill: #F4F2EC; stroke: #D6D1C6; stroke-width: 1.5"></circle>
</svg>
<button type="button" onClick="{{z.shR.pick}}" aria-label="{{z.shR.aria}}" aria-pressed="{{z.shR.pressed}}" style="position: absolute; left: 71px; top: 90px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.shR.border}}; background: {{z.shR.bg}}; color: {{z.shR.fg}}; box-shadow: {{z.shR.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.shR.days}}</button>
<button type="button" onClick="{{z.shL.pick}}" aria-label="{{z.shL.aria}}" aria-pressed="{{z.shL.pressed}}" style="position: absolute; left: 203px; top: 90px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.shL.border}}; background: {{z.shL.bg}}; color: {{z.shL.fg}}; box-shadow: {{z.shL.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.shL.days}}</button>
<button type="button" onClick="{{z.abR.pick}}" aria-label="{{z.abR.aria}}" aria-pressed="{{z.abR.pressed}}" style="position: absolute; left: 113px; top: 146px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.abR.border}}; background: {{z.abR.bg}}; color: {{z.abR.fg}}; box-shadow: {{z.abR.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.abR.days}}</button>
<button type="button" onClick="{{z.abL.pick}}" aria-label="{{z.abL.aria}}" aria-pressed="{{z.abL.pressed}}" style="position: absolute; left: 161px; top: 146px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.abL.border}}; background: {{z.abL.bg}}; color: {{z.abL.fg}}; box-shadow: {{z.abL.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.abL.days}}</button>
<button type="button" onClick="{{z.thR.pick}}" aria-label="{{z.thR.aria}}" aria-pressed="{{z.thR.pressed}}" style="position: absolute; left: 115px; top: 240px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.thR.border}}; background: {{z.thR.bg}}; color: {{z.thR.fg}}; box-shadow: {{z.thR.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.thR.days}}</button>
<button type="button" onClick="{{z.thL.pick}}" aria-label="{{z.thL.aria}}" aria-pressed="{{z.thL.pressed}}" style="position: absolute; left: 159px; top: 240px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.thL.border}}; background: {{z.thL.bg}}; color: {{z.thL.fg}}; box-shadow: {{z.thL.ring}}; font-size: 15px; font-weight: 700; cursor: pointer">{{z.thL.days}}</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #4A5654">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #0B6B63"></span>Рекомендуем</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 2px solid #0B6B63; background: #FFFFFF"></span>Можно</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 2px solid #B4540A; background: #FBEBDD"></span>Отдыхает</span>
</div>
<div style="font-size: 12px; color: #5E6967">Цифра — сколько дней назад кололи в это место</div>
</section>
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{sel.label}}</div>
<div style="font-size: 13px; color: #5E6967">{{sel.last}}</div>
</div>
<span style="flex-shrink: 0; padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; background: {{sel.tagBg}}; color: {{sel.tagFg}}">{{sel.tag}}</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; border-bottom: 1px solid #ECE8DF">
<span style="font-size: 15px; font-weight: 500">Доза</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{dec}}" aria-label="Уменьшить дозу" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; background: #EFEBE3; color: #16211F; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<span style="min-width: 76px; text-align: center; font-family: Literata, Georgia, serif; font-size: 20px; font-weight: 600">{{dose}} ЕД</span>
<button type="button" onClick="{{inc}}" aria-label="Увеличить дозу" style="width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; background: #EFEBE3; color: #16211F; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px">
<label for="glucose" style="font-size: 15px; font-weight: 500">Сахар крови <span style="font-weight: 400; color: #5E6967">· по желанию</span></label>
<input id="glucose" type="text" placeholder="ммоль/л" style="width: 108px; height: 44px; box-sizing: border-box; border: 1.5px solid #D6D1C6; border-radius: 12px; padding: 0 12px; background: #FFFFFF; color: #16211F; font-size: 16px; text-align: right">
</div>
</div>
<a href="Main.dc.html" style="margin-top: auto; height: 54px; flex-shrink: 0; border-radius: 27px; background: #0B6B63; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; text-decoration: none">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M20 6 9 17l-5-5"></path></svg>
<span>Укол сделан · {{sel.short}}</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const selId = s.sel || 'abR';
    const dose = typeof s.dose === 'number' ? s.dose : 12;
    const plural = (n, f) => { const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return f[0]; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return f[1]; return f[2]; };
    const zones = [
      { id: 'abL', label: 'Живот, слева', short: 'живот слева', days: 1, date: '25 сентября' },
      { id: 'thR', label: 'Бедро, правое', short: 'правое бедро', days: 2, date: '24 сентября' },
      { id: 'thL', label: 'Бедро, левое', short: 'левое бедро', days: 3, date: '23 сентября' },
      { id: 'shR', label: 'Плечо, правое', short: 'правое плечо', days: 4, date: '22 сентября' },
      { id: 'shL', label: 'Плечо, левое', short: 'левое плечо', days: 5, date: '21 сентября' },
      { id: 'abR', label: 'Живот, справа', short: 'живот справа', days: 6, date: '20 сентября' }
    ];
    const looks = {
      best: { bg: '#0B6B63', border: '#0B6B63', fg: '#FFFFFF', tag: 'Рекомендуем', tagBg: '#DDEEEA', tagFg: '#0B5A53' },
      ok: { bg: '#FFFFFF', border: '#0B6B63', fg: '#0B5A53', tag: 'Можно', tagBg: '#EFEBE3', tagFg: '#16211F' },
      rest: { bg: '#FBEBDD', border: '#B4540A', fg: '#8F4207', tag: 'Пусть отдохнёт', tagBg: '#FBEBDD', tagFg: '#8F4207' }
    };
    const maxDays = Math.max.apply(null, zones.map((zn) => zn.days));
    const z = {};
    let sel = null;
    zones.forEach((zn) => {
      const look = looks[zn.days === maxDays ? 'best' : zn.days <= 3 ? 'rest' : 'ok'];
      const isSel = zn.id === selId;
      const ago = zn.days === 1 ? 'вчера' : zn.days + ' ' + plural(zn.days, ['день', 'дня', 'дней']) + ' назад';
      z[zn.id] = Object.assign({}, look, {
        days: zn.days,
        pressed: isSel,
        ring: isSel ? '0 0 0 3px #FFFFFF, 0 0 0 6px #16211F' : 'none',
        aria: zn.label + ', последний укол ' + ago,
        pick: () => this.setState({ sel: zn.id })
      });
      if (isSel) sel = Object.assign({}, look, { label: zn.label, short: zn.short, last: 'Последний укол сюда: ' + zn.date + ', ' + ago });
    });
    return {
      z: z,
      sel: sel,
      dose: dose,
      dec: () => this.setState({ dose: Math.max(1, dose - 1) }),
      inc: () => this.setState({ dose: Math.min(80, dose + 1) })
    };
  }
}
</script>
</body>
</html>
