<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Medicines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2EC;color:#16211F;font-family:Onest,system-ui,sans-serif}
a{color:#0B6B63}a:hover{color:#08524C}
button,input{font-family:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F2EC; color: #16211F; font-family: Onest, system-ui, sans-serif; overflow: hidden">
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.4px">Medicines</h1>
<div style="display: flex; gap: 8px">
<a href="ScanEn.dc.html" aria-label="Scan package" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid #D6D1C6; background: #FFFFFF; color: #16211F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M8 8h3v3H8z"></path><path d="M13 13h3v3h-3z"></path><path d="M13 8h3"></path><path d="M8 13v3"></path></svg>
</a>
<a href="AddMedEn.dc.html" aria-label="Add medicine" style="width: 44px; height: 44px; border-radius: 22px; background: #16211F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</a>
</div>
</header>
<a href="ExpiryEn.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 12px 12px 12px 16px; border-radius: 20px; background: #FFFFFF; color: #16211F; text-decoration: none">
<span style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: #EFEBE3; color: #4A5654; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Expiry dates</span>
<span style="font-size: 13px; color: #8F4207">1 expired, 2 expiring soon</span>
</span>
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: #5E6967"><path d="m9 18 6-6-6-6"></path></svg>
</a>
<sc-if value="{{showAlert}}" hint-placeholder-val="{{true}}">
<div style="background: #FBEBDD; border: 1.5px solid #E7B894; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: #FFFFFF; color: #8F4207; display: flex; align-items: center; justify-content: center">
<svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{alertTitle}}</div>
<div style="font-size: 14px; color: #8F4207">{{alertText}}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{buy}}" style="height: 44px; border-radius: 22px; border: none; background: #0B6B63; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Bought a pack</button>
<button type="button" onClick="{{toggleList}}" aria-pressed="{{inList}}" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid #B4540A; background: #FFFFFF; color: #8F4207; font-size: 14px; font-weight: 600; cursor: pointer">{{listLabel}}</button>
</div>
</div>
</sc-if>
<sc-if value="{{showBought}}" hint-placeholder-val="{{false}}">
<div style="background: #DDEEEA; border-radius: 20px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: #0B5A53; stroke-width: 2.2"><path d="M20 6 9 17l-5-5"></path></svg>
<div style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #0B5A53">{{boughtText}}</div>
<button type="button" onClick="{{undo}}" style="height: 44px; padding: 0 12px; border: none; border-radius: 22px; background: transparent; color: #0B5A53; font-size: 14px; font-weight: 600; cursor: pointer">Undo</button>
</div>
</sc-if>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #5E6967">Supply by schedule</h2>
<span style="font-size: 13px; color: #5E6967">lasts</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid {{r.divider}}">
<div style="width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; background: #EFEBE3; color: #4A5654; display: flex; align-items: center; justify-content: center">
<sc-if value="{{r.isShot}}" hint-placeholder-val="{{false}}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 2 4 4"></path><path d="m17 7 3-3"></path><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"></path><path d="m9 11 4 4"></path><path d="m5 19-3 3"></path><path d="m14 4 6 6"></path></svg></sc-if>
<sc-if value="{{r.isPill}}" hint-placeholder-val="{{true}}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg></sc-if>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{r.subColor}}">{{r.sub}}</span>
<div style="height: 4px; margin-top: 2px; border-radius: 2px; background: #ECE8DF; overflow: hidden"><div style="height: 4px; border-radius: 2px; width: {{r.barW}}; background: {{r.barColor}}"></div></div>
</div>
<div style="width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-family: Literata, Georgia, serif; font-size: 22px; line-height: 1; font-weight: 600; color: {{r.daysColor}}">{{r.days}}</span>
<span style="font-size: 12px; color: #5E6967">{{r.daysWord}}</span>
</div>
</div>
</sc-for>
</div>
</section>
</main>
<nav aria-label="Sections" style="flex-shrink: 0; height: 76px; box-sizing: border-box; padding: 8px 8px 14px; background: #FFFFFF; border-top: 1px solid #E2DED4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="MainEn.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #4A5654; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
<span>Today</span>
</a>
<a href="HistoryEn.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #4A5654; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
<span>History</span>
</a>
<a href="StockEn.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #0B6B63; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v4"></path><path d="M14 13h-4"></path><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path><path d="M18 6v14"></path><path d="M6 6v14"></path><rect x="2" y="6" width="20" height="14" rx="2"></rect></svg>
<span>Medicines</span>
</a>
<a href="AccessEn.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #4A5654; text-decoration: none">
<svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span>Family</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const bought = s.bought === true;
    const inList = s.inList === true;
    const plural = (n, f) => (n === 1 ? f[0] : f[1]);
    const raw = [
      { id: 'ins', name: 'Insulin glargine', left: bought ? 348 : 48, unit: 'U', per: '12 U a day', perDay: 12, shot: true },
      { id: 'ndl', name: 'Pen needles', left: 9, unit: 'pcs', per: '1 a day', perDay: 1, shot: true },
      { id: 'd3', name: 'Vitamin D3 2,000 IU', left: 12, unit: 'caps', expiry: 'expires 11/2026', perDay: 1 },
      { id: 'metf', name: 'Metformin 850 mg', left: 34, unit: 'tabs', per: '2 a day', perDay: 2 },
      { id: 'ator', name: 'Atorvastatin 20 mg', left: 27, unit: 'tabs', per: '1 a day', perDay: 1 },
      { id: 'levo', name: 'Levothyroxine 50 mcg', left: 88, unit: 'tabs', per: '1 a day', perDay: 1 }
    ];
    const rows = raw.map((r) => {
      const days = Math.floor(r.left / r.perDay);
      const low = days <= 7;
      return {
        id: r.id,
        name: r.name,
        isShot: !!r.shot,
        isPill: !r.shot,
        days: days,
        daysWord: plural(days, ['day', 'days', 'days']),
        leftText: r.left + ' ' + r.unit,
        sub: r.left + ' ' + r.unit + ' · ' + (r.expiry || r.per),
        subColor: r.expiry ? '#8F4207' : '#5E6967',
        barW: Math.min(100, Math.round(days / 30 * 100)) + '%',
        barColor: low ? '#B4540A' : '#0B6B63',
        daysColor: low ? '#8F4207' : '#16211F'
      };
    }).sort((a, b) => a.days - b.days).map((r, i) => Object.assign({}, r, { divider: i === 0 ? '#FFFFFF' : '#ECE8DF' }));
    const low = rows[0];
    const ins = rows.find((r) => r.id === 'ins');
    return {
      rows: rows,
      showAlert: low.days <= 7,
      showBought: bought,
      alertTitle: low.name + ' is running low',
      alertText: low.leftText + ' left — enough for ' + low.days + ' ' + low.daysWord,
      boughtText: 'Insulin restocked: enough for ' + ins.days + ' ' + ins.daysWord,
      inList: inList,
      listLabel: inList ? 'On shopping list' : 'Add to shopping list',
      buy: () => this.setState({ bought: true }),
      undo: () => this.setState({ bought: false }),
      toggleList: () => this.setState({ inList: !inList })
    };
  }
}
</script>
</body>
</html>
