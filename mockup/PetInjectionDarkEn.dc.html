<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pet injection site — dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 12px; background: #111715; color: #ECEAE4; font-family: Onest, system-ui, sans-serif">
<a href="MainDarkEn.dc.html" style="align-self: flex-start; height: 44px; margin-left: -8px; padding: 0 8px; display: flex; align-items: center; gap: 2px; font-size: 16px; font-weight: 500; color: #4FBFB0; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="m15 18-6-6 6-6"></path></svg>
<span>Today</span>
</a>
<div role="group" aria-label="Pet" style="display: flex; gap: 8px">
<sc-for list="{{pets}}" as="p" hint-placeholder-count="2">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height: 44px; box-sizing: border-box; padding: 0 14px 0 6px; border-radius: 22px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 16px; background: {{p.avatarBg}}; color: {{p.avatarFg}}; display: flex; align-items: center; justify-content: center; font-size: 13px">{{p.initial}}</span>
<span>{{p.label}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 28px; line-height: 1.15; font-weight: 600">{{medTitle}}</h1>
<div style="font-size: 15px; color: #B7C0BD">{{medSub}}</div>
</div>
<section aria-label="Choose injection site" style="background: #1A2220; border-radius: 20px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Side" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #252F2C">
<sc-for list="{{sides}}" as="sd" hint-placeholder-count="2">
<button type="button" onClick="{{sd.pick}}" aria-pressed="{{sd.on}}" style="height: 40px; border: none; border-radius: 10px; padding: 0; background: {{sd.bg}}; color: {{sd.fg}}; box-shadow: {{sd.shadow}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{sd.label}}</button>
</sc-for>
</div>
<div style="position: relative; width: 318px; height: 218px">
<sc-if value="{{isCat}}" hint-placeholder-val="{{true}}">
<svg width="318" height="218" viewBox="0 0 320 220" aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: {{flip}}">
<path d="M70 100 C 42 94 28 66 36 34" style="fill: none; stroke: #34403D; stroke-width: 12; stroke-linecap: round"></path>
<ellipse cx="92" cy="118" rx="30" ry="34" style="fill: #34403D"></ellipse>
<rect x="76" y="130" width="14" height="74" rx="7" style="fill: #34403D"></rect>
<rect x="96" y="132" width="14" height="72" rx="7" style="fill: #2C3634"></rect>
<ellipse cx="150" cy="112" rx="88" ry="36" style="fill: #34403D"></ellipse>
<rect x="224" y="126" width="14" height="78" rx="7" style="fill: #2C3634"></rect>
<rect x="204" y="128" width="14" height="76" rx="7" style="fill: #34403D"></rect>
<ellipse cx="216" cy="106" rx="30" ry="33" style="fill: #34403D"></ellipse>
<ellipse cx="240" cy="86" rx="16" ry="27" transform="rotate(35 240 86)" style="fill: #34403D"></ellipse>
<polygon points="244,54 248,20 267,44" style="fill: #34403D"></polygon>
<polygon points="263,42 283,18 287,54" style="fill: #34403D"></polygon>
<circle cx="262" cy="64" r="26" style="fill: #34403D"></circle>
<ellipse cx="284" cy="74" rx="12" ry="10" style="fill: #34403D"></ellipse>
</svg>
</sc-if>
<sc-if value="{{isDog}}" hint-placeholder-val="{{false}}">
<svg width="318" height="218" viewBox="0 0 320 220" aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: {{flip}}">
<path d="M62 94 C 44 86 36 66 42 46" style="fill: none; stroke: #34403D; stroke-width: 13; stroke-linecap: round"></path>
<ellipse cx="94" cy="112" rx="34" ry="38" style="fill: #34403D"></ellipse>
<rect x="74" y="126" width="18" height="80" rx="8" style="fill: #34403D"></rect>
<rect x="98" y="128" width="18" height="78" rx="8" style="fill: #2C3634"></rect>
<ellipse cx="152" cy="108" rx="92" ry="38" style="fill: #34403D"></ellipse>
<rect x="228" y="124" width="18" height="82" rx="8" style="fill: #2C3634"></rect>
<rect x="206" y="126" width="18" height="80" rx="8" style="fill: #34403D"></rect>
<ellipse cx="222" cy="102" rx="32" ry="37" style="fill: #34403D"></ellipse>
<ellipse cx="246" cy="76" rx="20" ry="30" transform="rotate(35 246 76)" style="fill: #34403D"></ellipse>
<ellipse cx="266" cy="52" rx="26" ry="22" style="fill: #34403D"></ellipse>
<rect x="274" y="48" width="38" height="22" rx="11" style="fill: #34403D"></rect>
<circle cx="309" cy="54" r="5" style="fill: #56615E"></circle>
<path d="M252 36 C 238 40 234 64 242 80 C 252 78 260 60 262 40 Z" style="fill: #28312F"></path>
</svg>
</sc-if>
<sc-for list="{{zones}}" as="z" hint-placeholder-count="3">
<button type="button" onClick="{{z.pick}}" aria-label="{{z.aria}}" aria-pressed="{{z.pressed}}" style="position: absolute; left: {{z.left}}; top: {{z.top}}; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; padding: 0; border: 2px solid {{z.border}}; background: {{z.bg}}; color: {{z.fg}}; box-shadow: {{z.ring}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{z.days}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #B7C0BD">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 7px; background: #4FBFB0"></span>Recommended</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 2px solid #4FBFB0; background: #1A2220"></span>OK</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 7px; border: 2px solid #D98641; background: #3A2717"></span>Resting</span>
</div>
<div style="font-size: 12px; line-height: 1.4; color: #97A29F">Number — days since an injection here. The scruff is shown on both sides.</div>
</section>
<div style="background: #1A2220; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{sel.label}}</div>
<div style="font-size: 13px; color: #97A29F">{{sel.last}}</div>
</div>
<span style="flex-shrink: 0; padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; background: {{sel.tagBg}}; color: {{sel.tagFg}}">{{sel.tag}}</span>
</div>
<a href="MainDarkEn.dc.html" style="margin-top: auto; height: 54px; flex-shrink: 0; border-radius: 27px; background: #4FBFB0; color: #1A2220; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M20 6 9 17l-5-5"></path></svg>
<span>Injection done · {{sel.short}}</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startPet":{"editor":"enum","options":["cat","dog"],"default":"cat"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const pet = s.pet || this.props.startPet || 'cat';
    const side = s.side || 'left';
    const plural = (n, f) => (n === 1 ? f[0] : f[1]);
    const PETS = {
      cat: {
        label: 'Barsik', initial: 'B', title: 'Insulin glargine · 2 U', sub: 'Barsik, cat, 4.2 kg · today at 20:00',
        pos: { scruff: [212, 76], chest: [204, 116], flank: [140, 112] },
        days: { scruff: 2, chestL: 5, flankL: 3, chestR: 1, flankR: 4 }
      },
      dog: {
        label: 'Rex', initial: 'R', title: 'Insulin · 8 U', sub: 'Rex, dog, 18 kg · today at 20:00',
        pos: { scruff: [216, 70], chest: [212, 112], flank: [140, 108] },
        days: { scruff: 4, chestL: 2, flankL: 6, chestR: 3, flankR: 1 }
      }
    };
    const P = PETS[pet];
    const ZONES = [
      { id: 'scruff', part: 'scruff', label: 'Scruff', short: 'scruff' },
      { id: 'chestL', part: 'chest', side: 'left', label: 'Chest, left side', short: 'chest left' },
      { id: 'flankL', part: 'flank', side: 'left', label: 'Flank, left', short: 'flank left' },
      { id: 'chestR', part: 'chest', side: 'right', label: 'Chest, right side', short: 'chest right' },
      { id: 'flankR', part: 'flank', side: 'right', label: 'Flank, right', short: 'flank right' }
    ];
    const maxDays = Math.max.apply(null, ZONES.map((z) => P.days[z.id]));
    const best = ZONES.find((z) => P.days[z.id] === maxDays).id;
    const selId = s.sel && s.selPet === pet ? s.sel : best;
    const looks = {
      best: { bg: '#4FBFB0', border: '#4FBFB0', fg: '#1A2220', tag: 'Recommended', tagBg: '#173530', tagFg: '#7ED8CB' },
      ok: { bg: '#1A2220', border: '#4FBFB0', fg: '#7ED8CB', tag: 'OK', tagBg: '#252F2C', tagFg: '#ECEAE4' },
      rest: { bg: '#3A2717', border: '#D98641', fg: '#F3A76E', tag: 'Let it rest', tagBg: '#3A2717', tagFg: '#F3A76E' }
    };
    const W = 318;
    const agoText = (d) => (d === 1 ? 'yesterday' : d + ' ' + plural(d, ['day', 'days', 'days']) + ' ago');
    let sel = null;
    const zones = [];
    ZONES.forEach((z) => {
      const d = P.days[z.id];
      const look = looks[z.id === best ? 'best' : d <= 2 ? 'rest' : 'ok'];
      if (z.id === selId) sel = Object.assign({}, look, { label: z.label, short: z.short, last: 'Last injection here: ' + agoText(d) });
      if (z.side && z.side !== side) return;
      const xy = P.pos[z.part];
      const x = side === 'right' ? xy[0] : W - xy[0];
      zones.push(Object.assign({}, look, {
        days: d,
        left: (x - 22) + 'px',
        top: (xy[1] - 22) + 'px',
        pressed: z.id === selId,
        ring: z.id === selId ? '0 0 0 3px #1A2220, 0 0 0 6px #ECEAE4' : 'none',
        aria: z.label + ', last injection ' + agoText(d),
        pick: () => this.setState({ sel: z.id, selPet: pet })
      }));
    });
    const chip = (on) => (on ? { bg: '#ECEAE4', fg: '#1A2220', border: '#ECEAE4', avatarBg: '#9FE0D6', avatarFg: '#0F3531' } : { bg: '#1A2220', fg: '#ECEAE4', border: '#3A4542', avatarBg: '#252F2C', avatarFg: '#ECEAE4' });
    const seg = (on) => (on ? { bg: '#1A2220', fg: '#ECEAE4', shadow: '0 1px 3px rgba(22, 33, 31, 0.18)' } : { bg: 'transparent', fg: '#B7C0BD', shadow: 'none' });
    return {
      pets: ['cat', 'dog'].map((k) => Object.assign({ label: PETS[k].label, initial: PETS[k].initial, on: k === pet, pick: () => this.setState({ pet: k }) }, chip(k === pet))),
      sides: [
        Object.assign({ label: 'Left side', on: side === 'left', pick: () => this.setState({ side: 'left' }) }, seg(side === 'left')),
        Object.assign({ label: 'Right side', on: side === 'right', pick: () => this.setState({ side: 'right' }) }, seg(side === 'right'))
      ],
      isCat: pet === 'cat',
      isDog: pet === 'dog',
      flip: side === 'right' ? 'none' : 'scaleX(-1)',
      medTitle: P.title,
      medSub: P.sub,
      zones: zones,
      sel: sel
    };
  }
}
</script>
</body>
</html>
