<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Палитра тёмной темы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111715;color:#ECEAE4;font-family:Onest,system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; background: #111715; color: #ECEAE4; font-family: Onest, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; line-height: 1.15; font-weight: 600">Тёмная тема</h1>
<div style="font-size: 14px; line-height: 1.4; color: #97A29F">Каждый цвет светлой темы — пара в тёмной</div>
</div>
<section style="background: #1A2220; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #97A29F">
<span>Роль</span><span>Светлая</span><span>Тёмная</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
<div style="display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(2, minmax(0, 1fr)); gap: 8px; align-items: center; min-height: 42px; border-top: 1px solid #262F2C">
<span style="font-size: 14px; font-weight: 500; line-height: 1.25">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 7px; border: 1px solid #3A4542; background: {{r.light}}"></span>
<span style="font-size: 12px; color: #B7C0BD; font-variant-numeric: tabular-nums">{{r.light}}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 7px; border: 1px solid #3A4542; background: {{r.dark}}"></span>
<span style="font-size: 12px; color: #B7C0BD; font-variant-numeric: tabular-nums">{{r.dark}}</span>
</span>
</div>
</sc-for>
</section>
<section style="background: #1A2220; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #97A29F">Настройки · Оформление</span>
<span style="font-size: 15px; font-weight: 600">Тема</span>
</div>
<div role="group" aria-label="Тема" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #2A3431">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 44px; border: none; border-radius: 10px; padding: 0 4px; background: {{m.bg}}; color: {{m.fg}}; font-size: 14px; font-weight: 600; cursor: pointer">{{m.label}}</button>
</sc-for>
</div>
<div style="font-size: 13px; line-height: 1.4; color: #97A29F">{{modeNote}}</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'system';
    const ROWS = [
      ['Фон', '#F4F2EC', '#111715'],
      ['Карточка', '#FFFFFF', '#1A2220'],
      ['Текст', '#16211F', '#ECEAE4'],
      ['Вторичный текст', '#4A5654', '#B7C0BD'],
      ['Подписи', '#5E6967', '#97A29F'],
      ['Основной цвет', '#0B6B63', '#4FBFB0'],
      ['Бирюзовый текст', '#0B5A53', '#7ED8CB'],
      ['Мягкий бирюзовый', '#DDEEEA', '#173530'],
      ['Внимание — текст', '#8F4207', '#F3A76E'],
      ['Внимание — рамка', '#B4540A', '#D98641'],
      ['Мягкий оранжевый', '#FBEBDD', '#3A2717'],
      ['Заливка кнопок', '#EFEBE3', '#252F2C'],
      ['Рамки', '#D6D1C6', '#3A4542'],
      ['Разделители', '#ECE8DF', '#262F2C']
    ];
    const MODES = [
      { id: 'system', label: 'Как в системе', note: 'По умолчанию: тема меняется вместе с телефоном.' },
      { id: 'light', label: 'Светлая', note: 'Всегда светлая, даже ночью.' },
      { id: 'dark', label: 'Тёмная', note: 'Всегда тёмная. Экраны напоминания и сканера тёмные в любой теме.' }
    ];
    return {
      rows: ROWS.map((r) => ({ name: r[0], light: r[1], dark: r[2] })),
      modes: MODES.map((m) => ({
        label: m.label,
        on: m.id === mode,
        bg: m.id === mode ? '#ECEAE4' : 'transparent',
        fg: m.id === mode ? '#1A2220' : '#B7C0BD',
        pick: () => this.setState({ mode: m.id })
      })),
      modeNote: MODES.find((m) => m.id === mode).note
    };
  }
}
</script>
</body>
</html>
